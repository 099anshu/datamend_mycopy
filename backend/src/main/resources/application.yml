spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/timeseries}
    username: ${DB_USER:dev}
    password: ${DB_PASSWORD:dev}
  flyway:
    enabled: true
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

ml-service:
  base-url: http://localhost:8000

management:
  endpoints:
    web:
      exposure:
        include: health