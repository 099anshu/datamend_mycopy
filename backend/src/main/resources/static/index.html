<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataMend - Anomaly Detection</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>DataMend - Anomaly Detection</h1>
    </header>

    <main>
        <section id="form-section">
            <h2>Configuration</h2>

            <label for="dataset">Dataset</label>
            <input type="text" id="dataset" value="ETTh1">

            <label for="columns">Columns (comma-separated)</label>
            <input type="text" id="columns" value="HUFL,HULL,MUFL,MULL,LUFL,LULL,OT">

            <label for="detector">Detector</label>
            <input type="text" id="detector" value="timercd">

            <label for="threshold">Threshold</label>
            <input type="number" id="threshold" value="0.8" min="0" max="1" step="0.05">

            <h2>Corruption</h2>

            <label class="inline">
                <input type="checkbox" id="corruption-enabled">
                Enable corruption
            </label>

            <label for="corruption-method">Method</label>
            <select id="corruption-method">
                <option value="mcar">mcar</option>
                <option value="mar_logistic">mar_logistic</option>
                <option value="mnar_x">mnar_x</option>
                <option value="mnar_t">mnar_t</option>
                <option value="mnar_nonuniform">mnar_nonuniform</option>
                <option value="rdo">rdo</option>
                <option value="seq_missing">seq_missing</option>
                <option value="block_missing">block_missing</option>
            </select>

            <div id="corruption-params" class="params">
                <!-- corruption method parameters rendered here -->
            </div>

            <h2>Missing-Value Handling</h2>

            <label for="mvh-strategy">Strategy</label>
            <select id="mvh-strategy">
                <option value="reject">reject</option>
                <option value="ffill">ffill</option>
                <option value="bfill">bfill</option>
                <option value="mean">mean</option>
                <option value="interpolate">interpolate</option>
            </select>
        </section>

        <section id="actions">
            <button id="btn-analyze" type="button">Analyze</button>
            <button id="btn-scores" type="button">Get Scores</button>
            <button id="btn-reset" type="button">Reset</button>
            <span id="status" class="status" aria-live="polite"></span>
        </section>

        <section id="results-section">
            <h2>Results</h2>

            <div id="summary" class="summary"></div>

            <label for="json-output">Response</label>
            <pre id="json-output" class="json">(no request yet)</pre>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
